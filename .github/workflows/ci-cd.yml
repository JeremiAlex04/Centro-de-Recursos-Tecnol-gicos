name: CI/CD & Build Portable CLI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: Pruebas unitarias y validacion
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ejecutar pruebas pytest
        run: |
          pytest -v

  build:
    name: Compilar ejecutable portable (.exe)
    needs: test
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Compilar binario unico con PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --add-data "catalog;catalog" `
            --name "recursos-jeremialex04" `
            src/recursos/__main__.py
          # Tambien generar version de un solo archivo portable
          pyinstaller --noconfirm --onefile --console `
            --add-data "catalog;catalog" `
            --name "recursos-jeremialex04" `
            src/recursos/__main__.py

      - name: Generar SHA-256 del ejecutable
        run: |
          Get-FileHash dist/recursos-jeremialex04.exe -Algorithm SHA256 | Out-File dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publicar artefacto de compilacion
        uses: actions/upload-artifact@v4
        with:
          name: recursos-jeremialex04-windows
          path: |
            dist/recursos-jeremialex04.exe
            dist/SHA256SUMS.txt

      - name: Publicar Release (si es tag o master)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/recursos-jeremialex04.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
