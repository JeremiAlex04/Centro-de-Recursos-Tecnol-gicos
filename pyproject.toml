[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recursos-jeremialex04"
version = "0.1.0"
description = "CLI y Aplicacion de Escritorio para gestionar el Centro de Recursos Tecnologicos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pyyaml>=6",
    "customtkinter>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
recursos-jeremialex04 = "recursos.cli:app"
recursos = "recursos.cli:app"
recursos-gui = "recursos.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
